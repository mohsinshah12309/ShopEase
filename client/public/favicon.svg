<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06070a" stop-opacity="0"/>
    </radialGradient>
    <!-- Primary Gradient (White -> Purple -> Cyan) -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- Secondary Gradient (Cyan -> Purple -> Orange) -->
    <linearGradient id="secondary-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    <!-- Glow Effect Filter -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Radial Glow -->
  <circle cx="50%" cy="50%" r="45%" fill="url(#bg-glow)"/>
  
  <!-- Outer Squircle Glass Panel Border -->
  <rect x="12" y="12" width="76" height="76" rx="20" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" fill="rgba(255, 255, 255, 0.04)"/>
  <rect x="13" y="13" width="74" height="74" rx="19" stroke="url(#primary-grad)" stroke-width="1" opacity="0.3" fill="none"/>
  
  <!-- Stylized Geometric 'N' Logo Mark -->
  <g filter="url(#glow-filter)">
    <!-- Left Pillar -->
    <path d="M 30 28 L 30 72 C 30 74.5, 33 76, 35 74.5 L 42 69 L 42 37 L 30 28 Z" fill="url(#primary-grad)"/>
    <!-- Diagonal Connecting Pillar -->
    <path d="M 42 37 L 58 63 L 58 28 C 58 25.5, 61 24, 63 25.5 L 70 31 L 70 63 C 70 68.5, 66 71.5, 60 67 L 42 37 Z" fill="url(#primary-grad)"/>
    <!-- Bottom Corner Accents -->
    <path d="M 58 63 L 70 72 L 70 63 Z" fill="url(#secondary-grad)" opacity="0.85"/>
  </g>
</svg>